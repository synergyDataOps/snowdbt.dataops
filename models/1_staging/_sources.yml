version: 2

sources:
  - name: raw_data
    tables:
      - name: address
        columns:
          - name: addressid
            data_type: number
            tests:
              - unique
              - not_null
          - name: addressline1
            data_type: varchar
          - name: addressline2
            data_type: varchar
          - name: city
            data_type: varchar
          - name: modifieddate
            data_type: timestamp_ntz
          - name: postalcode
            data_type: varchar
          - name: spatiallocation
            data_type: varchar
          - name: stateprovinceid
            data_type: number
          - name: rowguid
            data_type: varchar

      - name: businessentityaddress
        columns:
          - name: addressid
            data_type: number
          - name: addresstypeid
            data_type: number
          - name: businessentityid
            data_type: number
          - name: modifieddate
            data_type: timestamp_ntz
          - name: rowguid
            data_type: varchar

      - name: countryregion
        columns:
          - name: countryregioncode
            data_type: varchar
          - name: modifieddate
            data_type: timestamp_ntz
          - name: name
            data_type: varchar

      - name: customer
        columns:
          - name: accountnumber
            data_type: varchar
